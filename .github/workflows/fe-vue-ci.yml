name: fe-vue CI

on:
  push:
    branches:
      - main
    paths:
      - apps/fe-vue/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/fe-vue-ci.yml
  pull_request:
    paths:
      - apps/fe-vue/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/fe-vue-ci.yml
  workflow_dispatch:

concurrency:
  group: fe-vue-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test fe-vue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter fe-vue run test:unit

      - name: Build for e2e
        run: pnpm --filter fe-vue run build-only

      - name: Install Playwright browsers
        run: pnpm --filter fe-vue exec playwright install --with-deps chromium firefox

      - name: Run e2e tests
        run: pnpm --filter fe-vue run test:e2e
        env:
          CI: true

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare
        run: pnpm --filter fe-vue run build:cloudflare

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter fe-vue run deploy:cloudflare
