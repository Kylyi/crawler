name: fe-vue CI

on:
  push:
    branches:
      - main
    paths:
      - apps/fe-vue/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/fe-vue-ci.yml
  pull_request:
    paths:
      - apps/fe-vue/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/fe-vue-ci.yml
  workflow_dispatch:

concurrency:
  group: fe-vue-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test fe-vue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter fe-vue exec playwright install --with-deps chromium firefox

      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter fe-vue exec playwright install-deps chromium firefox

      - name: Run unit tests
        run: pnpm --filter fe-vue run test
        env:
          CI: true

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: apps/fe-vue/test-results/vitest-junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Build for e2e
        run: pnpm --filter fe-vue run build

      - name: Run e2e tests
        run: pnpm exec tsx scripts/main.ts fe-vue/test:e2e
        env:
          CI: true

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/fe-vue/playwright-report/
            apps/fe-vue/test-results/
          retention-days: 14

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare
        run: pnpm exec tsx scripts/main.ts fe-vue/build:cloudflare

      - name: Deploy to Cloudflare Workers
        run: pnpm exec tsx scripts/main.ts fe-vue/deploy:cloudflare
